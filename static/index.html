<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng ra Excel</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="desk">
    <article class="ledger" id="ledger">
      <div class="spine" aria-hidden="true"></div>
      <div class="page">
        <header class="mast">
          <h1>Bảng ra Excel</h1>
          <p>Đọc PDF scan và ảnh chụp — hóa đơn, bảng lương, sao kê, giấy tờ thuế. Chữ tiếng Việt có dấu được nhận trên máy này, mỗi bảng thành một sheet.</p>
        </header>

        <form id="form">
          <label class="drop" id="drop">
            <input id="files" name="files" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff,.gif,application/pdf,image/*" multiple>
            <span class="beam" aria-hidden="true"></span>
            <span class="drop-copy">
              <strong>Thả PDF hoặc ảnh vào tờ này</strong>
              <span>JPG, PNG, WEBP, TIFF, PDF. Nhiều file một lúc. Kéo thẳng, đủ sáng thì dấu tiếng Việt khỏi rơi.</span>
            </span>
          </label>

          <ul class="file-list" id="file-list" hidden></ul>

          <fieldset class="options">
            <legend>Cách đọc</legend>
            <label class="check">
              <input type="checkbox" id="borderless" checked>
              <span>Bảng không có đường kẻ</span>
            </label>
            <label class="check">
              <input type="checkbox" id="outside" checked>
              <span>Giữ tiêu đề, ghi chú, chữ nằm ngoài bảng</span>
            </label>
          </fieldset>

          <div class="actions">
            <button type="submit" class="go" id="go">Đọc và xuất Excel</button>
            <a class="download" id="download" hidden>Tải file Excel</a>
          </div>
        </form>

        <p class="status" id="status" role="status">Đang chuẩn bị bộ đọc chữ…</p>
        <div class="meter" id="meter" hidden>
          <span id="meter-bar"></span>
        </div>
        <p class="note" id="note" hidden></p>

        <section class="result" id="result" hidden>
          <div class="tabs" id="tabs" role="tablist"></div>
          <div class="grid-wrap" id="grid"></div>
        </section>
      </div>
    </article>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
